# htAiGateway 多模型配置
#
# 启动方式:
#   CONFIG_PATH=./config.yaml go run cmd/main.go
#
# 客户端调用时通过 X-Model Header 选择模型:
#   curl -H "Authorization: Bearer sk-gateway-secret" \
#        -H "X-Model: deepseek" \
#        -H "Content-Type: application/json" \
#        -d '{"model":"deepseek-chat","messages":[{"role":"user","content":"hello"}]}' \
#        http://localhost:8080/openai/v1/chat/completions

gateway:
  listen_addr: ":8080"
  api_key: "Yht520DaBao"       # 网关统一鉴权 Key，客户端调用时传入
  timeout_seconds: 120
  sqlite_max_conns: 1  # SQLite 连接池大小，默认 1（SQLite 推荐单连接，高并发可适当增大）
loadbalancer:
  model_name: "ht-model"
  model:
    name: deepseek-v4-pro         # LLM 分词模型，用于语义分词
    protocol: openai
    backend_url: https://api.deepseek.com
    api_key: sk-xxx
  strategy: embedding               # 策略：embedding / round_robin / least_conn
  top_k: 3                          # 返回相似度最高的前 K 个候选
  min_similarity: 0.5               # 最小相似度阈值，低于此值不选
  use_llm_parse: false              # 是否启用LLM语义解析分词（默认false，简单分词goformer够用）

